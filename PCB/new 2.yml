1. Introduction

1.1 Background and Context

Freshwater shortage is a big deal these days. Cities keep growing and farms need more water, so everyone’s using up local water sources and putting pressure on how water gets delivered. At home, we turn a lot of clean water into wastewater from cooking and cleaning. If this water doesn’t have toilet waste mixed in, it’s called greywater.

Using greywater for things like watering gardens is a smart way to save clean water. But it comes with stuff like soap, oils, and sometimes salt. Before we just start pouring it on plants, we need to make sure it won’t cause more harm than good.

1.2 Statement of the Problem

Sure, greywater cuts down how much clean water a household needs. Still, if you start using laundry or kitchen water directly on your plants, over time it could mess up the soil, make it salty, or build up chemicals that slow plant growth. That’s why we need to measure exactly how different kinds of greywater, with different TDS and pH, affect plant growth and soil compared to regular tap water.

1.3 Relevance to NCSC 2026 Focal Theme

This project matches the NCSC theme about saving water—it’s right in line with ideas about recycling and reducing waste at home.

---

2. Objectives

1. Check TDS and pH levels for tap water, kitchen greywater, and laundry greywater so we know what’s going into the pots.
2. Track tomato plants’ growth, leaf color, and height for each water type over ten days.
3. Watch how the soil changes: does it crust over, stay loose, or get clogged up? Does the pH shift too much?
4. Come up with a cheap, easy way other families can recycle greywater safely for their own plants.

---

3. Hypothesis

Tomato plants watered with laundry greywater—high in TDS and pretty alkaline—won’t do as well as those given tap or kitchen water. You’ll see stunted growth and unhappy leaves because the extra salts and chemicals make it hard for roots to absorb water. Lighter kitchen greywater won’t hurt much and might work almost as well as tap water.

---

4. Methodology

4.1 Sample Collection and Preparation

We’ll set up three treatments:

* Treatment A (Control): Regular tap water.
* Treatment B: Kitchen greywater—rinsing water from veggies or grains, no grease or harsh soaps.
* Treatment C: Laundry greywater—rinse water from doing laundry using everyday detergent.

4.2 Analytical Instruments and Measurement Protocols

Before every watering, check water quality with:

* A handheld TDS meter—stick it into a 100 mL sample to read the dissolved solids.
* pH test strips—dip into the water or soil runoff to see how acidic or alkaline everything is.

4.3 Plant Cultivation Setup

Each treatment gets its own pot (15 cm wide, drainage holes at the bottom), filled with the same mix of soil and compost. We’ll use tomato seedlings all started at the same height (8.0 cm).

* Pot A: 150 mL tap water daily
* Pot B: 150 mL kitchen greywater daily
* Pot C: 150 mL laundry greywater daily

All pots get the same sunlight, temperature, and care. Every day, record plant height, stem thickness, leaf color, and how fast water soaks into the soil.

---

5. Proposed Observation & Data Collection Plan

5.1 Baseline Water Quality Measurement Protocol

Before watering, measure:

* TDS: Use the meter in a 100 mL water sample.
* pH: Test strips in both the water and the drainage water (runoff).

---

6. Anticipated Results & Discussion

6.1 Expected Impact of High TDS & Surfactants

Based on earlier studies, laundry greywater should have TDS above 500 ppm and a pH over 8.0. That’s a lot for young tomato plants, so we expect them to struggle—think slower growth, yellow or burnt leaf tips, and generally they’ll look less healthy compared to plants given regular water.

6.2 Expected Soil Reactions & Infiltration Changes

Laundry water use will probably make the soil salty and ‘slick’ from leftover soap, so water won’t soak in as quickly and the soil’s pH will go up. Kitchen greywater, being gentler, should keep soil and plants happy—almost like tap water.

6.3 Expected Final Conclusion

It looks promising that kitchen rinse water can be reused as-is for growing things like tomatoes. Laundry water, though, will need to be filtered or diluted before it’s garden-safe.

---

7. Proposed Solutions to the Problem & Action Plan

Here’s a simple plan any household can try:

* Collect kitchen rinse water—use it straight for garden plants.
* Collect laundry water—first pour it through a basic filter (layers of gravel, sand, and maybe charcoal).
* After filtering, mix it with an equal amount of rainwater or tap water. This should bring the TDS down to safer levels (below 300 ppm) before using it in the garden.

---

8. Limitations

* We’re only observing for 10 days—that’s not enough to see long-term changes in soil or repeated plant cycles.
* We’re not testing every possible chemical; just TDS and pH with simple handheld gear.
* We’re only growing tomatoes—other crops might react differently.

