Abstract

This project sets out to see how well household greywater works for watering tomato plants, and what it does to the soil and water quality. We’ll put kitchen rinse water and laundry greywater side by side with regular tap water, checking things like TDS (total dissolved solids) and pH before each watering.

We’ll use three pots of tomato seedlings, all the same, and keep an eye on them for 10 days. Besides watching plant growth, we’ll look for signs of stress, like leaf yellowing or tough soil in the laundry water group. Kitchen greywater, which has fewer dissolved solids, should let the plants grow as usual. Laundry water, with higher TDS and pH, might actually harm them.

Our results will help figure out if separating and reusing greywater at home really saves water without hurting plants or soil. We’ll also test simple ideas—like small-scale filtration—to make sure household greywater makes sense for gardens.

